name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: Build and backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: software/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: software/backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run build
      - run: python -m pytest backend/tests -q
      - name: Check fresh migrations
        working-directory: software/backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m alembic check

  browser:
    name: Browser purchase and responsive flows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: software/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: software/backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: software/.test-artifacts/playwright-results
          retention-days: 7
