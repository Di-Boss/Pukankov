name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: Build and backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: software/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: software/backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run build
      - run: python -m pytest backend/tests -q
      - name: Check fresh migrations
        working-directory: software/backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m alembic check

  browser:
    name: Browser purchase and responsive flows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: software/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: software/backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: software/.test-artifacts/playwright-results
          retention-days: 7

  hardware:
    name: Hardware contracts and Mega compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python hardware/scripts/check_projects.py
      - run: python -m unittest discover -s hardware/wokwi/ticket-validator/tests -v
      - run: python -m unittest discover -s software/scripts/tests -v
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Mega toolchain and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli lib install "Servo@1.3.0" "MFRC522@1.4.12" "AccelStepper@1.64.0" "LiquidCrystal I2C@1.1.2"
      - name: Compile vending controller
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vending_machine"
          cp hardware/wokwi/vending-machine/sketch.ino "$RUNNER_TEMP/vending_machine/vending_machine.ino"
          arduino-cli compile --fqbn arduino:avr:mega "$RUNNER_TEMP/vending_machine"
